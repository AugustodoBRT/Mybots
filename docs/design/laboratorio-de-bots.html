/* Layout: one working bench. A sticky control strip on top, a big living specimen beside its trait sheet,
   then three rows of comparisons (evolution, states, team) and a draw-lots grid. Dark-first, OLED black. */
:root {
  --bg: #000000; --surface: #0E0E0D; --surface2: #171715; --line: #262522; --fg: #ECE8DF; --muted: #8E8A80;
  --accent: #FFA52E; --accent-ink: #1A1000;
  --f-ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-glyph: "BotGlyphs", ui-monospace, "JetBrains Mono", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F7F4EE; --surface: #FFFFFF; --surface2: #EFEBE2; --line: #DDD7CA; --fg: #1D1B17; --muted: #6E695E;
  --accent: #B35F00; --accent-ink: #FFFFFF; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F7F4EE; --surface: #FFFFFF; --surface2: #EFEBE2; --line: #DDD7CA; --fg: #1D1B17; --muted: #6E695E;
  --accent: #B35F00; --accent-ink: #FFFFFF; color-scheme: light; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; }
main { max-width: 1120px; margin-inline: auto; display: grid; gap: 44px; }
h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.1; margin: 0; letter-spacing: -0.02em; font-weight: 700; text-wrap: balance; }
h2 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 62ch; margin-top: 10px; }
.sec-head { display: grid; gap: 4px; margin-bottom: 16px; }
.sec-head p { color: var(--muted); max-width: 66ch; }
.tag { font-family: var(--f-glyph); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.group > label, .group > .lab { font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; gap: 2px; }
.seg button { font: inherit; font-size: 13px; color: var(--muted); background: transparent; border: 0; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font: inherit; font-size: 13px; font-weight: 500; color: var(--accent-ink); background: var(--accent); border: 0; padding: 7px 14px; border-radius: 9px; cursor: pointer; }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
input[type="text"] { font: inherit; font-size: 14px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; width: 130px; }
.swatches { display: flex; gap: 6px; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; }
.sw[aria-pressed="true"] { border-color: var(--fg); }

.bench { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; align-items: stretch; }
@media (max-width: 760px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; display: grid; place-items: center; padding: 22px; min-height: 360px; }
.dial { display: grid; gap: 10px; align-content: start; }
.dial-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.dial-name { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.dial-val { font-family: var(--f-glyph); color: var(--muted); font-size: 13px; }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 28px; }
.stops { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.traits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; margin-top: 8px; border-top: 1px solid var(--line); }
.trait { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.trait:nth-child(odd) { padding-right: 14px; }
.trait:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--line); }
.trait span:first-child { color: var(--muted); }

<script>
(() => {

const STATES = [['idle', 'Parado'], ['working', 'Trabalhando'], ['waiting', 'Esperando'], ['sleep', 'Dormindo'], ['error', 'Erro'], ['done', 'Concluído']];

const COLORS = [['#8FA6FF', 'Pervinca'], ['#34C9A8', 'Água'], ['#B58CFF', 'Violeta'], ['#FFB27A', 'Pêssego'], ['#FF8FB1', 'Rosa'], ['#B7C86A', 'Oliva'], ['#F2C14E', 'Sol'], ['#FF7B67', 'Coral']];

/* ---------- build one bot from a name and a weirdness (0..1) ---------- */

function makeCreature(seed, w) {

/* ---------- draw one frame into a grid of cells {c, k, a} ---------- */
function drawForm(bot, F, state, t) {

      else if (upOut || downOut) c = '─';

  else if (state === 'error') mouth = w < 0.45 ? '~' : '~~~';
  else if (state === 'done') mouth = w < 0.45 ? '‿' : base;

  }

  } else if (face.top === 'ears') {

    }
  }

  if (sleep) for (let k = 0; k < 3; k++) { const ph = ((t / 3200) + k / 3) % 1; const zx = CX + Math.floor(F.bw / 2) + 1 + ph * 2, zy = TOP + dy - ph * 4; if (free(zx, zy)) put(zx, zy, k % 2 ? 'Z' : 'z', 'dim', clamp(1.15 - ph, 0, 1)); }
