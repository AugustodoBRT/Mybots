<script>
  (function initBotFaceCustomizer() {
    const names = ['Pipoca', 'Teco', 'Faísca', 'Biscoito', 'Zico', 'Foguete', 'Mochi', 'Pingo', 'Lula', 'Bug'];
    const heroImg = document.getElementById('hero-face-img');
    const heroGlow = document.getElementById('avatar-glow');
    const traitsLabel = document.getElementById('bot-traits');
    const nameInput = document.getElementById('bot-name-input');
    const weirdnessSlider = document.getElementById('weirdness-slider');
    const weirdnessPill = document.getElementById('weirdness-val-pill');
    const colorLabel = document.getElementById('active-color-name');
    const faceCards = document.querySelectorAll('.face-card');
    const paletteBtns = document.querySelectorAll('.palette-btn');

    // Face Selector Logic
    faceCards.forEach(card => {
      card.addEventListener('click', () => {
        const src = card.getAttribute('data-face-src');
        const traits = card.getAttribute('data-traits');
        if (src && heroImg) {
          heroImg.src = src;
          heroImg.classList.add('scale-110');
          setTimeout(() => heroImg.classList.remove('scale-110'), 200);
        }
        if (traits && traitsLabel) {
          traitsLabel.textContent = traits;
        }

        // Selection Styling
        faceCards.forEach(c => {
          c.classList.remove('shadow-[0_0_12px_rgba(255,159,28,0.35)]');
          const badge = c.querySelector('.bg-primary-container');
          if (badge) badge.remove();
          const label = c.querySelector('span:last-child');
          if (label) {
            label.classList.remove('text-primary', 'font-semibold');
            label.classList.add('text-on-surface-variant/60');
          }
        });

        card.classList.add('shadow-[0_0_12px_rgba(255,159,28,0.35)]');
        const dot = document.createElement('div');
        dot.className = 'absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-primary-container';
        card.appendChild(dot);
        const activeLabel = card.querySelector('span:last-child');
        if (activeLabel) {
          activeLabel.classList.remove('text-on-surface-variant/60');
          activeLabel.classList.add('text-primary', 'font-semibold');
        }
      });
    });

    // Palette Selector Logic
    paletteBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const glow = btn.getAttribute('data-glow') || 'rgba(255,159,28,0.4)';
        const cName = btn.getAttribute('data-color-name') || '';
        
        paletteBtns.forEach(b => {
          b.innerHTML = '';
          b.style.boxShadow = 'none';
        });

        btn.innerHTML = '<span class="w-2 h-2 rounded-full bg-surface"></span>';
        btn.style.boxShadow = `0 0 10px ${glow}`;
        
        if (heroGlow) {
          heroGlow.style.backgroundColor = glow;
        }
        if (colorLabel) {
          colorLabel.textContent = cName;
        }
      });
    });

    // Weirdness Dial Handler
    if (weirdnessSlider && weirdnessPill) {
      weirdnessSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        weirdnessPill.textContent = val + '%';
        if (heroImg) {
          const rotation = ((val - 50) / 50) * 12;
          heroImg.style.transform = `rotate(${rotation}deg)`;
        }
      });
    }

    // Name Randomizer Button
    const btnRandName = document.getElementById('btn-random-name');
    if (btnRandName && nameInput) {
      btnRandName.addEventListener('click', () => {
        const next = names[Math.floor(Math.random() * names.length)];
        nameInput.value = next;
        nameInput.classList.add('text-primary');
        setTimeout(() => nameInput.classList.remove('text-primary'), 300);
      });
    }

    // Master Randomize Set
    const btnRandAll = document.getElementById('btn-randomize-all');
    if (btnRandAll) {
      btnRandAll.addEventListener('click', () => {
        if (nameInput) {
          nameInput.value = names[Math.floor(Math.random() * names.length)];
        }
        const randomCard = faceCards[Math.floor(Math.random() * faceCards.length)];
        if (randomCard) randomCard.click();

        const randomPalette = paletteBtns[Math.floor(Math.random() * paletteBtns.length)];
        if (randomPalette) randomPalette.click();

        if (weirdnessSlider) {
          const randVal = Math.floor(Math.random() * 90) + 5;
          weirdnessSlider.value = randVal;
          weirdnessSlider.dispatchEvent(new Event('input'));
        }
      });
    }

    // Continue Trigger Animation
    const btnSubmit = document.getElementById('btn-submit-step');
    if (btnSubmit) {
      btnSubmit.addEventListener('click', () => {
        btnSubmit.classList.add('opacity-90', 'scale-95');
        setTimeout(() => {
          btnSubmit.classList.remove('opacity-90', 'scale-95');
        }, 180);
      });
    }
  })();
</script></main>
